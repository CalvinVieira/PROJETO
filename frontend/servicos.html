<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serviços TI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-head">
        <div>
          <h1>Serviços de TI</h1>
          <p class="muted">Gerencie catálogo, responsáveis e SLA dos serviços com base no ITIL.</p>
        </div>
      </div>

      <div class="card">
        <form id="servicoForm" class="form-grid">
          <input type="hidden" id="servicoId">
          <select class="input" id="empresaId" required></select>
          <input class="input" id="nome" placeholder="Nome do serviço" required>
          <input class="input" id="categoria" placeholder="Categoria do serviço" required>
          <input class="input" id="responsavel" placeholder="Responsável pelo serviço">
          <input class="input" id="slaHoras" type="number" min="1" placeholder="SLA em horas">
          <select class="input" id="status">
            <option value="Ativo">Ativo</option>
            <option value="Em revisão">Em revisão</option>
            <option value="Descontinuado">Descontinuado</option>
          </select>
          <textarea class="input" id="descricao" placeholder="Descrição do serviço" rows="3"></textarea>
          <button class="btn btn-primary" type="submit">Salvar serviço</button>
        </form>
      </div>

      <div class="card">
        <div class="page-head" style="margin-bottom:12px">
          <div>
            <h2 style="margin:0;font-size:1.1rem">Catálogo de serviços</h2>
          </div>
          <button class="btn btn-secondary" onclick="listar()">Atualizar</button>
        </div>
        <table class="table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Categoria</th>
              <th>Responsável</th>
              <th>SLA</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="servicoTabela"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="auth.js"></script>
  <script src="utils.js"></script>
  <script src="servicos.js"></script>
</body>
</html>
