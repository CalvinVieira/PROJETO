<!DOCTYPE html>
<html lang='pt-BR'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Entrar no Stratec TI</title>
    <link rel='icon' type='image/png' href='assets/logo-icon.png'>
    <link rel='stylesheet' href='style.css'>
</head>

<body class='auth-wrap'>
    <div class='card auth-card'>
        <div class='auth-header'><a href='index.html'><img src='assets/logo.png' class='auth-logo'></a>
            <h2>Entrar no Stratec TI</h2>
            <p class='muted'>Acesse sua conta e continue sua análise de maturidade</p>
        </div>
        <div id='msg'></div>
        <div style='display:flex;justify-content:space-between;align-items:center'><a class='btn-link'
                href='index.html'>← Voltar para Home</a><a class='btn-link' href='#'
                onclick="alert('Em produção, esta ação envia instruções de redefinição por e-mail.');return false;">Esqueci
                minha senha</a></div>
        <form id='loginForm'><label>E-mail<input class='input' type='email' id='email'
                    required></label><label>Senha<input class='input' type='password' id='senha'
                    required></label><button class='btn btn-primary' type='submit'>Entrar</button> <a
                class='btn btn-secondary' href='cadastro.html'>Criar conta</a></form>
    </div>
    <script src='auth.js'></script>
    <script src='login.js'></script>
</body>

</html>
