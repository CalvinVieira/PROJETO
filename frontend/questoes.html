<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questões</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main">
            <div class="page-head">
                <div>
                    <h1>Questões</h1>
                    <p class="muted">Administre o questionário de maturidade com foco em COBIT, ITIL e ISO 27000.</p>
                </div>
            </div>

            <div class="card">
                <form id="questaoForm" class="form-grid">
                    <input type="hidden" id="questaoId">

                    <input class="input" id="pergunta" placeholder="Pergunta" required>

                    <select class="input" id="tipoAvaliacao" required>
                        <option value="">Selecione o tipo de avaliação</option>
                        <option value="Governança">Governança</option>
                        <option value="Gestão">Gestão</option>
                    </select>

                    <select class="input" id="categoria" required>
                        <option value="">Selecione a categoria</option>
                        <option value="Governança">Governança</option>
                        <option value="Estratégia">Estratégia</option>
                        <option value="Riscos">Riscos</option>
                        <option value="Desempenho e Valor">Desempenho e Valor</option>
                        <option value="Segurança">Segurança</option>
                        <option value="Controle de Acesso">Controle de Acesso</option>
                        <option value="Continuidade e Backup">Continuidade e Backup</option>
                        <option value="Infraestrutura">Infraestrutura</option>
                        <option value="Incidentes e Problemas">Incidentes e Problemas</option>
                        <option value="Mudanças e Liberação">Mudanças e Liberação</option>
                        <option value="Processos">Processos</option>
                        <option value="Serviços e SLA">Serviços e SLA</option>
                        <option value="Serviços">Serviços</option>
                        <option value="Pessoas">Pessoas</option>
                        <option value="Dados">Dados</option>
                        <option value="Proteção de Dados">Proteção de Dados</option>
                    </select>

                    <input class="input" id="peso" type="number" min="1" max="5" value="3" required>

                    <button class="btn btn-primary" type="submit">Salvar questão</button>
                </form>
            </div>

            <div class="card">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Tipo</th>
                            <th>Categoria</th>
                            <th>Pergunta</th>
                            <th>Peso</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="questaoTabela"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="auth.js"></script>
    <script src="utils.js"></script>
    <script src="questoes.js"></script>
</body>
</html>
